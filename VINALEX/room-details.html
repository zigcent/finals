
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Room Details | VINALEX HOTEL</title>

<link rel="stylesheet" href="style.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f2ed;
    color: #333;
}

.details-container {
    max-width: 1100px;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.details-container img {
    width: 100%;
    height: 450px;
    object-fit: cover;
    border-radius: 10px;
}

.details-container h1 {
    margin-top: 25px;
    color: #9b7848;
}

.room-info {
    line-height: 1.8;
    margin-top: 20px;
}

.room-info h3 {
    color: #9b7848;
}

.back-button {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 25px;
    background: #9b7848;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.back-button:hover {
    background: #765a34;
}

@media (max-width: 600px) {
    .details-container {
        margin: 20px;
        padding: 20px;
    }

    .details-container img {
        height: 250px;
    }
}
</style>
</head>

<body>

<div class="details-container">

    <img id="roomImage" src="" alt="Hotel Room">

    <h1 id="roomName">ROOM DETAILS</h1>

    <div class="room-info">
        <h3>Room Description</h3>
        <p id="roomDescription"></p>

        <h3>Room Features</h3>
        <ul id="roomFeatures"></ul>

        <h3>Room Capacity</h3>
        <p id="roomCapacity"></p>

        <h3>Room Price</h3>
        <p id="roomPrice"></p>
    </div>

    <a href="index.html#rooms" class="back-button">
        BACK TO ROOMS
    </a>

</div>

<script>
const rooms = {

    standard: {
        name: "STANDARD ROOM",
        image: "standard.avif",
        description: "A cozy and comfortable room designed for guests looking for a relaxing and affordable stay at VINALEX HOTEL.",
        features: ["Comfortable Bed", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television"],
        capacity: "2 Guests",
        price: "₱2,000 per night"
    },

    deluxe: {
        name: "DELUXE ROOM",
        image: "deluxe.avif",
        description: "Enjoy a spacious and elegant room with modern interiors and upgraded comfort.",
        features: ["King Size Bed", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television", "Mini Refrigerator"],
        capacity: "2 Guests",
        price: "₱3,000 per night"
    },

    executive: {
        name: "EXECUTIVE ROOM",
        image: "executive.avif",
        description: "A sophisticated accommodation designed for business travelers and guests who prefer additional comfort.",
        features: ["King Size Bed", "Work Desk", "Air Conditioning", "Free WiFi", "Private Bathroom", "Television"],
        capacity: "2 Guests",
        price: "₱4,000 per night"
    },

    junior: {
        name: "JUNIOR SUITE",
        image: "junior.avif",
        description: "A stylish and spacious room featuring a comfortable sleeping area and a separate sitting space.",
        features: ["King Size Bed", "Sitting Area", "Air Conditioning", "Free WiFi", "Private Bathroom"],
        capacity: "2 Guests",
        price: "₱4,500 per night"
    },

    suite: {
        name: "SUITE ROOM",
        image: "suite.avif",
        description: "Experience extra space and comfort with a separate bedroom and living area.",
        features: ["King Size Bed", "Separate Living Room", "Air Conditioning", "Free WiFi", "Television", "Private Bathroom"],
        capacity: "2-3 Guests",
        price: "₱5,000 per night"
    },

    presidential: {
        name: "PRESIDENTIAL SUITE",
        image: "presidential.avif",
        description: "Our most luxurious accommodation, offering premium comfort, elegant interiors, and exclusive facilities.",
        features: ["Luxury King Size Bed", "Large Living Room", "Private Dining Area", "Free WiFi", "Premium Bathroom", "Mini Bar"],
        capacity: "2-4 Guests",
        price: "₱10,000 per night"
    },

    single: {
        name: "SINGLE ROOM",
        image: "single.avif",
        description: "A simple and comfortable room perfect for guests traveling alone.",
        features: ["Single Bed", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television"],
        capacity: "1 Guest",
        price: "₱1,500 per night"
    },

    double: {
        name: "DOUBLE ROOM",
        image: "double.avif",
        description: "A comfortable room featuring one double bed, suitable for two guests.",
        features: ["Double Bed", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television"],
        capacity: "2 Guests",
        price: "₱2,500 per night"
    },

    twin: {
        name: "TWIN ROOM",
        image: "twin.avif",
        description: "A comfortable room with two separate beds, ideal for friends or companions.",
        features: ["Two Single Beds", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television"],
        capacity: "2 Guests",
        price: "₱2,500 per night"
    },

    family: {
        name: "FAMILY ROOM",
        image: "family.avif",
        description: "A spacious accommodation designed for families who want to enjoy their stay together.",
        features: ["Multiple Beds", "Air Conditioning", "Private Bathroom", "Free WiFi", "Television"],
        capacity: "4-5 Guests",
        price: "₱5,500 per night"
    },

    connecting: {
        name: "CONNECTING ROOM",
        image: "connecting.avif",
        description: "Two separate rooms connected by an interior door, providing convenience for families and groups.",
        features: ["Two Separate Rooms", "Connecting Door", "Private Bathrooms", "Free WiFi", "Air Conditioning"],
        capacity: "4 Guests",
        price: "₱6,000 per night"
    },

    accessible: {
        name: "ACCESSIBLE ROOM",
        image: "accessible.avif",
        description: "A thoughtfully designed room with accessible facilities for guests with mobility needs.",
        features: ["Accessible Bathroom", "Wheelchair-Friendly Space", "Comfortable Bed", "Free WiFi", "Air Conditioning"],
        capacity: "2 Guests",
        price: "₱2,500 per night"
    }

};

const params = new URLSearchParams(window.location.search);
const roomType = params.get("room");
const room = rooms[roomType];

if (room) {
    document.title = room.name + " | VINALEX HOTEL";

    document.getElementById("roomImage").src = room.image;
    document.getElementById("roomName").textContent = room.name;
    document.getElementById("roomDescription").textContent = room.description;
    document.getElementById("roomCapacity").textContent = room.capacity;
    document.getElementById("roomPrice").textContent = room.price;

    const features = document.getElementById("roomFeatures");

    room.features.forEach(feature => {
        const li = document.createElement("li");
        li.textContent = feature;
        features.appendChild(li);
    });

} else {
    document.getElementById("roomName").textContent = "ROOM NOT FOUND";
    document.getElementById("roomDescription").textContent = "Sorry, this room is not available.";
    document.getElementById("roomImage").style.display = "none";
}
</script>

</body>
</html>
